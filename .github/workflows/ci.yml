name: CI

# 只做一件事：每次提交在一台干净机器上从零装依赖、编译、跑测试。
# 不做打包、不做发版——发布流程仍需人工按 docs/RELEASING.md 执行。

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  frontend:
    name: 前端类型检查与构建
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # tsc 报错在 tauri dev 里不一定当场炸，单独跑一次才能挡住。
      - run: npm run typecheck

      - run: npm run build

  rust:
    name: Rust 单测与端到端
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # 与本机 rustc 1.99.0 对齐。不钉版本的话上游 stable 一升，
      # CI 可能因为新 lint 或新语义变红，而本地仍是绿的，
      # 那次失败就与自己的改动无关。升级 Rust 时同步改这里。
      - uses: dtolnay/rust-toolchain@1.99.0

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # 181 MB，缓存键取 fetch-ffmpeg.ps1 的内容哈希：
      # 脚本里的 autobuild tag 一改，键就变，自动重新下载。
      # 不设 restore-keys，避免旧版本 ffmpeg 命中后让直拷表测在错的版本上。
      - name: 缓存 ffmpeg
        id: ffmpeg-cache
        uses: actions/cache@v6
        with:
          path: vendor/ffmpeg/bin
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('scripts/fetch-ffmpeg.ps1') }}

      - name: 下载 ffmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./scripts/fetch-ffmpeg.ps1

      # 测试本身找不到 ffmpeg 会 panic，这里先给出可读的错误，
      # 免得失败信息是一串「创建临时目录失败」的下游症状。
      - name: 确认 9 个文件就位
        shell: pwsh
        run: |
          $required = @(
            'ffmpeg.exe', 'ffprobe.exe',
            'avcodec-63.dll', 'avdevice-63.dll', 'avfilter-12.dll',
            'avformat-63.dll', 'avutil-61.dll', 'swresample-7.dll', 'swscale-10.dll'
          )
          $missing = @($required | Where-Object { -not (Test-Path "vendor/ffmpeg/bin/$_") })
          if ($missing.Count -gt 0) {
            throw "vendor/ffmpeg/bin 缺文件：$($missing -join ', ')"
          }
          & vendor/ffmpeg/bin/ffmpeg.exe -version | Select-Object -First 1

      - name: 单测（152 个，纯函数）
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      # 真跑 ffmpeg 并回读产物。铁律 2：不允许静默跳过。
      - name: 端到端（11 个）
        run: cargo test --manifest-path src-tauri/Cargo.toml --test e2e

      # 71 个格式 × 重编码/直拷。格式表、参数构建、直拷表改动后必须过。
      - name: 全格式扫描（8 个）
        run: cargo test --manifest-path src-tauri/Cargo.toml --test formats_sweep
