[package]
name = "mediaforge-v2"
version = "2.0.0"
description = "MediaForge — 媒体格式转换器"
authors = ["Naimio"]
edition = "2024"

[lib]
name = "mediaforge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "mediaforge-v2"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 体积优先：LTO + 单编译单元 + 优化尺寸 + 去符号 + abort 代替 unwind。
# 参考 https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
