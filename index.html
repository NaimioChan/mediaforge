<!doctype html>
<!--
  `data-ix-theme` / `data-ix-color-schema` 写在 <html> 上，就是 iX 主题的开关：
  `classic` 是开源版自带的那一套配色，`system` 让它跟随系统的深浅色。
  写在标签上而不是由脚本注入，首帧拿到的就是对的配色，不会闪一下默认调色板。

  图标不写在 HTML 里。iX 的图标值是 `data:image/svg+xml;utf8,<原始 SVG>`，
  内含引号，塞进属性会被截断；由 `icons.ts` 在启动时赋给控件的 `icon` 属性。
-->
<html lang="zh-CN" data-ix-theme="classic" data-ix-color-schema="system">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MediaForge</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <div class="app" id="app">
      <!-- 顶部工具条 -->
      <header class="toolbar" id="toolbar">
        <div class="brand">
          <img class="brand-mark" src="/src/assets/logo.png" alt="" width="24" height="24" />
          <span class="brand-name">MediaForge</span>
        </div>
        <div class="toolbar-actions">
          <ix-button id="btn-add-files" variant="primary">添加文件</ix-button>
          <ix-button id="btn-add-folder" variant="secondary">添加文件夹</ix-button>
          <span class="toolbar-sep" role="separator"></span>
          <ix-button id="btn-start" variant="primary">开始转换</ix-button>
          <ix-button id="btn-cancel" variant="secondary" disabled>取消</ix-button>
          <ix-button id="btn-clear" variant="tertiary" disabled>清空</ix-button>
        </div>
      </header>

      <!-- 主体：左队列 + 右参数 -->
      <main class="main">
        <section class="queue" id="queue">
          <div class="empty-state" id="empty-state">
            <ix-empty-state
              id="empty-view"
              layout="large"
              header="把文件拖进窗口"
              sub-header="支持文件与文件夹，也可以点上面的「添加文件」"
            ></ix-empty-state>
          </div>
          <ul class="task-list" id="task-list"></ul>
        </section>

        <aside class="panel" id="panel">
          <h2 class="panel-title">转换参数</h2>
          <div class="panel-body" id="panel-body">
            <p class="panel-empty">选中一条任务后可调参数</p>
          </div>

          <ix-divider></ix-divider>

          <div class="field">
            <label class="field-label" for="output-dir">输出目录</label>
            <div class="dir-row">
              <ix-input id="output-dir" placeholder="与源文件同目录"></ix-input>
              <ix-button id="btn-pick-dir" variant="secondary">选择</ix-button>
            </div>
            <p class="field-help">留空则输出到源文件旁边；可直接输入或粘贴路径</p>
          </div>

          <ix-divider></ix-divider>

          <div class="status-block" id="status-block">
            <p class="status-line" id="status-ffmpeg">ffmpeg 未就绪</p>
            <p class="status-line" id="status-caps"></p>
          </div>
        </aside>
      </main>

      <!-- 底部状态栏 -->
      <footer class="statusbar">
        <span id="status-summary">就绪</span>
        <span id="status-progress"></span>
        <button type="button" id="btn-version" class="version-button">v2.0.0</button>
      </footer>
    </div>

    <!-- 拖放提示层 -->
    <div class="drop-overlay" id="drop-overlay" hidden>
      <div class="drop-card">
        <ix-icon id="drop-icon" size="32"></ix-icon>
        <p class="drop-title">松手加入队列</p>
      </div>
    </div>
  </body>
</html>
